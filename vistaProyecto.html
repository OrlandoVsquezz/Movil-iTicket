<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/components/menu-cache.js"></script>
    <title>Detalle del proyecto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/proyectos.css">
</head>

<body class="proyectos-page">

    <header class="encabezado-flotante proyectos-header detalle-proyecto-header">
        <div class="regresar-subtitulo">
            <a href="proyectos.html" class="regresar" aria-label="Volver a proyectos">
                <img src="img/Regresar.png" alt="" class="imgRegresar">
            </a>
            <p class="subtitulo2">Detalle del proyecto</p>
        </div>
    </header>

    <main class="main proyectos-main">

        <nav class="bottom-nav-container">
            <div class="bottom-nav">

                <!-- Inicio (Inicia activo) -->
                <a href="inicio.html" class="nav-item" aria-label="Inicio">
                    <img src="img/inicioactivo.png" data-normal="img/inicio.png" data-active="img/inicioactivo.png"
                        alt="Inicio" class="nav-icon">
                </a>

                <!-- Tickets -->
                <a href="misTickets.html" class="nav-item" aria-label="Tickets">
                    <img src="img/Ticket.png" data-normal="img/Ticket.png" data-active="img/Ticketactivo.png"
                        alt="Tickets" class="nav-icon">
                </a>

                <!-- Botón Central -->
                <a href="crearTickets.html" class="nav-item fab-item" aria-label="Agregar">
                    <div class="fab-button">
                        <img src="img/Crear Ticket.png" data-normal="img/Crear Ticket.png"
                            data-active="img/Crear Ticket activo.png" alt="Agregar" class="fab-icon">
                    </div>
                </a>

                <!-- Mensajes -->
                <a href="#" class="nav-item" aria-label="Mensajes">
                    <img src="img/Chatbot.png" data-normal="img/Chatbot.png" data-active="img/Chatbotactivo.png"
                        alt="Mensajes" class="nav-icon">
                </a>

                <!-- Perfil -->
                <a href="perfil.html" class="nav-item" aria-label="Perfil">
                    <img src="img/Perfil.png" data-normal="img/Perfil.png" data-active="img/Perfilactivo.png"
                        alt="Perfil" class="nav-icon">
                </a>

            </div>
        </nav>

        <div class="d-flex flex-column gap-4">
            <!-- Panel de fases -->
            <div class="d-flex flex-column gap-2">

                <p class="subtitulo text-center encabezado-panel rounded-4 p-1 text-white">Fases</p>
                <!-- Seleccionar fases -->
                <select id="selectFase" class="form-select rounded-4 flex-grow-1">
                    <option value="" selected>Selecciona una fase</option>
                </select>

                <!-- Datos de la fase seleccionada -->
                <div id="tarjetaFaseSeleccionada" class="panel-contenido p-4 rounded-4 shadow-sm bg-white">
                    <p class="text-muted mb-0">
                        Selecciona una fase para ver su información.
                    </p>
                </div>
            </div>

            <!-- Panel de detalles -->
            <div class="d-flex flex-column gap-2">

                <p class="subtitulo text-center encabezado-panel rounded-4 p-1 text-white">Detalles de Fase</p>

                <!-- Acciones de los detalles -->
                <div class="d-flex flex-row gap-2 acciones-detalle-fase">
                    <button type="button" class="btn btn-azul-redondeado" id="btnEditarDetallesFase">
                        <i class="bi bi-pencil"></i> Editar
                    </button>
                    <button type="button" class="btn btn-azul-redondeado" id="btnAgregarDetalleFase">
                        <i class="bi bi-plus-lg"></i> Agregar
                    </button>
                </div>

                <dialog id="dialogAgregarDetalle" class="dialog-detalle-fase rounded-4">
                    <form id="formAgregarDetalleFase" class="d-flex flex-column gap-3 p-3">
                        <h6 class="texto-detalles fw-bold mb-0">Nuevo detalle</h6>
                        <input type="text" id="txtNuevoDetalleFase" class="form-control rounded-4"
                            placeholder="Descripción del detalle" maxlength="200" required>
                        <div class="d-flex flex-row gap-2 justify-content-end">
                            <button type="button" class="btn btn-azul-redondeado" id="btnCancelarDetalleFase">
                                Cancelar
                            </button>
                            <button type="submit" class="btn btn-azul-redondeado">
                                Guardar
                            </button>
                        </div>
                    </form>
                </dialog>

                <div id="tarjetaDetallesFase" class="panel-contenido p-4 rounded-4 shadow-sm bg-white">
                <p class="text-muted mb-0">
                    Selecciona una fase para ver sus detalles.
                    </p>
                </div>
            </div>
        </div>
    </main>


    <!-- JS personalizado -->
    <script src="js/components/menu.js"></script>
    <script type="module" src="js/controllers/vistaProyecto.js"></script>
</body>

</html>
