<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/proyectos.css">
</head>

<body class="proyectos-page">

    <header class="encabezado-flotante proyectos-header">
        <div class="d-flex flex-row justify-content-around">
            <div class="column mb-2">
                <h1 class="titulo">Proyectos</h1>
                <p class="texto">(Detalles del proyecto)</p>
            </div>
            <div class="row gap-2">
                <button type="button" class="notificaciones fs-4" style="color: black;" id="btnActualizarProyecto">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
                <a href="notificaciones.html" class="notificaciones fs-4" style="color: black;">
                    <i class="bi bi-bell"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="main proyectos-main">

        <div class="d-flex flex-column gap-4">
            <!-- Panel de fases -->
            <div class="d-flex flex-column gap-2">

                <p class="subtitulo text-center encabezado-panel rounded-4 p-1">Fases</p>
                <!-- Seleccionar fases -->
                <select id="selectFase" class="form-select rounded-4 flex-grow-1">
                    <option value="" selected>Selecciona una fase</option>
                </select>

                <!-- Datos de la fase seleccionada -->
                <div id="tarjetaFaseSeleccionada" class="panel-contenido p-4 rounded-4 shadow-sm bg-white">
                    <p class="text-muted mb-0">
                        Selecciona una fase para ver su información.
                    </p>
                </div>
            </div>

            <!-- Panel de detalles -->
            <div class="d-flex flex-column gap-2">

                <p class="subtitulo text-center encabezado-panel rounded-4 p-1">Detalles del proyecto</p>

                <div id="tarjetaDetallesProyecto" class="panel-contenido p-4 rounded-4 shadow-sm bg-white">
                    <p class="text-muted mb-0">
                        Selecciona una fase para ver los detalles del proyecto.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- JS personalizado -->
    <script src="js/components/menu.js"></script>
    <script src="js/components/common.js"></script>
</body>

</html>
