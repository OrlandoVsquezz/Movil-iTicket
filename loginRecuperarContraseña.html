<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="splash-active">

    <main class="main">

        <a href="login.html" class="regresar">
            <img src="img/Regresar.png" alt="Regresar" class="imgRegresar">
        </a>

        <div class="login-logo">
            <img src="img/Logo.png" alt="Logo iTicket">
        </div>

        <div class="subtitulo-texto">
            <p class="subtitulo">Recuperar contraseña</p>
            <p class="texto">Ingresa tu correo para enviarte un código</p>
        </div>

        <form class="form form-correo">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="20250267@ricaldone.edu.sv" autocomplete="email"
                    required>
            </div>

            <button type="submit" class="button">Enviar código</button>

        </form>

    </main>

    <!-- Curva azul decorativa fija en el pie de página -->
    <div class="login-bottom-wave"></div>

    <script type="module" src="js/components/login.js"></script>

</body>

</html>
