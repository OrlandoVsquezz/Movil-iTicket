<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="splash-active">

    <main class="main">

        <a href="loginRecuperarContraseña.html" class="regresar">
            <img src="img/Regresar.png" alt="Regresar" class="imgRegresar">
        </a>

        <div class="login-logo">
            <img src="img/Logo.png" alt="Logo iTicket">
        </div>

        <div class="subtitulo-texto">
            <p class="subtitulo">Ingresa el código</p>
            <p class="texto">Se envio un código de 6 digitos a tu
                <br> correo, ingresalo </p>
        </div>

        <form class="form form-contraseña   ">
            <div class="code-container">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="code-input" required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="code-input" required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="code-input" required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="code-input" required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="code-input" required>
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="code-input" required>
            </div>
            <button type="submit" class="button">Enviar código</button>
        </form>

    </main>

    <!-- Curva azul decorativa fija en el pie de página -->
    <div class="login-bottom-wave"></div>

    <script type="module" src="js/controllers/login.js"></script>

</body>

</html>
