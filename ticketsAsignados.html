<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets Asignados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/common.css">
</head>

<body>
    <header class="encabezado-flotante"></header>

    <main class="main">

        <!-- Contenido principal de ticketsAsignados -->
        <div class="d-flex justify-content-between encabezado-pagina">
            <h1 class="titulo">Asignados</h1>
            <div class="d-flex align-items-center gap-2">
                <!--Boton para cambiar de interfaz-->
                <div class="filter-wrapper">
                    <button type="button" class="notificaciones">
                        <img src="img/Cambiar.png" alt="Cambiar contenido" class="imgNotificaciones">
                    </button>

                    <div class="filter-panel" id="panelCambiar">
                        <a href="misTickets.html" class="filter-opcion">
                            <span class="filter-check"></span> Mis Tickets
                        </a>
                        <a href="ticketsAsignados.html" class="filter-opcion seleccionada">
                            <span class="filter-check"></span> Tickets Asignados
                        </a>
                        <a href="#" class="filter-opcion">
                            <span class="filter-check"></span> Gestión de Tickets
                        </a>
                        <a href="#" class="filter-opcion">
                            <span class="filter-check"></span> Proyectos
                        </a>
                    </div>
                </div>
                <button type="button" class="notificaciones-no-individual">
                    <img src="img/Notificaciones.png" alt="Notificaciones" class="imgNotificaciones">
                    <span class="notificacionAviso" hidden></span>
                </button>
            </div>
        </div>

        <div class="search-container">

            <div class="search-box">
                <span class="search-icon">
                    <img src="img/Buscart.png" alt="">
                </span>

                <input type="text" class="search-input" placeholder="Ingresa el asunto o código..." id="txtBuscar">
            </div>

            <div class="filters">

                <div class="filter-wrapper">
                    <button type="button" class="filter-button" data-filtro="prioridad">
                        <span class="filter-text">Prioridad</span>
                        <span class="filter-icon"><img src="img/Dropdown.png" alt="Dropdown"></span>
                    </button>

                    <div class="filter-panel" id="panelPrioridad">
                        <button type="button" class="filter-opcion" data-valor="">Ninguno</button>
                        <button type="button" class="filter-opcion" data-valor="Baja">Baja</button>
                        <button type="button" class="filter-opcion" data-valor="Media">Media</button>
                        <button type="button" class="filter-opcion" data-valor="Alta">Alta</button>
                        <button type="button" class="filter-opcion" data-valor="Critica">Crítica</button>
                    </div>
                </div>

                <div class="filter-wrapper">
                    <button type="button" class="filter-button" data-filtro="estado">
                        <span class="filter-text">Estado</span>
                        <span class="filter-icon"><img src="img/Dropdown.png" alt="Dropdown"></span>
                    </button>

                    <div class="filter-panel" id="panelEstado">
                        <button type="button" class="filter-opcion" data-valor="">Ninguno</button>
                        <button type="button" class="filter-opcion" data-valor="Nuevo">Nuevo</button>
                        <button type="button" class="filter-opcion" data-valor="Asignado">Asignado</button>
                        <button type="button" class="filter-opcion" data-valor="En proceso">En proceso</button>
                        <button type="button" class="filter-opcion" data-valor="En espera">En espera</button>
                        <button type="button" class="filter-opcion" data-valor="Resuelto">Resuelto</button>
                        <button type="button" class="filter-opcion" data-valor="Cerrado">Cerrado</button>
                        <button type="button" class="filter-opcion" data-valor="Vencido">Vencido</button>
                    </div>
                </div>

                <div class="filter-wrapper">
                    <button type="button" class="filter-button" id="btnFecha">
                        <span class="filter-text">Fecha</span>
                        <span class="filter-icon"><img src="img/Calendario.png" alt=""></span>
                    </button>
                    <!--Input de fecha oculto-->
                    <input type="date" id="inputFecha" class="input-fecha-oculto">
                </div>

            </div>
        </div>

        <!--Lista de tickets asignados-->
        <div class="tickets-stack" id="ticketsStack">
        </div>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <span class="text-muted small" id="infoTickets"></span>
            <nav aria-label="Paginacion">
                <ul class="pagination pagination-sm mb-0 align-items-center gap-1" id="paginacionTickets">
                    <li class="page-item">
                        <a class="page-link border-0 bg-transparent text-dark" href="#"><i
                                class="bi bi-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>

    <!-- Todo el menú -->
    <nav class="bottom-nav-container">
        <div class="bottom-nav">

            <!-- Inicio (Inicia activo) -->
            <a href="inicio.html" class="nav-item" aria-label="Inicio">
                <img src="img/inicioactivo.png" data-normal="img/inicio.png" data-active="img/inicioactivo.png"
                    alt="Inicio" class="nav-icon">
            </a>

            <!-- Tickets -->
            <a href="misTickets.html" class="nav-item active" aria-label="Tickets">
                <img src="img/Ticket.png" data-normal="img/Ticket.png" data-active="img/Ticketactivo.png" alt="Tickets"
                    class="nav-icon">
            </a>

            <!-- Botón Central -->
            <a href="crearTicket.html" class="nav-item fab-item" aria-label="Agregar">
                <div class="fab-button">
                    <img src="img/Crear Ticket.png" data-normal="img/Crear Ticket.png"
                        data-active="img/Crear Ticket activo.png" alt="Agregar" class="fab-icon">
                </div>
            </a>

            <!-- Mensajes -->
            <a href="chatbot.html" class="nav-item" aria-label="Mensajes">
                <img src="img/Chatbot.png" data-normal="img/Chatbot.png" data-active="img/Chatbotactivo.png"
                    alt="Mensajes" class="nav-icon">
            </a>

            <!-- Perfil -->
            <a href="perfil.html" class="nav-item" aria-label="Perfil">
                <img src="img/Perfil.png" data-normal="img/Perfil.png" data-active="img/Perfilactivo.png" alt="Perfil"
                    class="nav-icon">
            </a>

        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- JS personalizado -->
    <script type="module" src="js/components/common.js"></script>
    <script src="js/components/menu.js"></script>
    <script type="module" src="js/controllers/ticketsAsignados.js"></script>

</body>

</html>
