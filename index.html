<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libreria de elementos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>

  <!-- Aqui debe ir todo lo que hay en cada interfaz -->
  <main class="main">

        <!-- Formulario para los inputs y botones -->
        <form class="form">

          <!-- Input -->
          <div class="input-group">
              <label for="email">Este es un label</label>
              <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Este es un input"
              >
          </div>
    
          <!-- Botón mostrar contraseña -->
          <button type="button" class="password-icon" aria-label="Mostrar contraseña"></button>
          </button>
          </div>
    
          <!-- Checkbox -->
          <label class="remember">
              <input type="checkbox">
              <span>Este es un checkbox</span>
          </label>
    
          <!-- Botón -->
          <button type="submit" class="button">
            Este es un botón
          </button>
    </form>
    
    <form class="form">
      <!-- Botón 2 -->
      <button type="submit" class="button2">
        Este es otro botón
      </button>   
    </form>

    <button type="button" class="notificaciones">
      <img src="img/Notificaciones.png" alt="Notificaciones" class="imgNotificaciones">
      <span class="notificacionAviso" hidden></span> <!-- Aqui el punto rojo esta escondido-->
    </button>


    <div class="message-container">

      <button type="button" class="add-button">
        <img src="img/Crear Ticket.png" alt="">
      </button>
  
      <div class="message-input">
          <input 
              type="text" 
              placeholder="Envia un mensaje a Ticky">
  
          <button type="button" class="send-button">
              ↑
          </button>
      </div>
  
    </div>

  </main>

  <!-- Todo el menú -->
  <nav class="bottom-nav-container">
    <div class="bottom-nav">
      
      <!-- Inicio (Inicia activo) -->
      <a href="index.html" class="nav-item active" aria-label="Inicio">
        <img src="img/inicioactivo.png" 
             data-normal="img/inicio.png" 
             data-active="img/inicioactivo.png" 
             alt="Inicio" class="nav-icon">
      </a>

      <!-- Tickets -->
      <a href="login.html" class="nav-item" aria-label="Tickets">
        <img src="img/Ticket.png" 
             data-normal="img/Ticket.png" 
             data-active="img/Ticketactivo.png" 
             alt="Tickets" class="nav-icon">
      </a>

      <!-- Botón Central -->
      <a href="#" class="nav-item fab-item" aria-label="Agregar">
        <div class="fab-button">
          <img src="img/Crear Ticket.png" 
               data-normal="img/Crear Ticket.png" 
               data-active="img/Crear Ticket activo.png" 
               alt="Agregar" class="fab-icon">
        </div>
      </a>

      <!-- Mensajes -->
      <a href="#" class="nav-item" aria-label="Mensajes">
        <img src="img/Chatbot.png" 
             data-normal="img/Chatbot.png" 
             data-active="img/Chatbotactivo.png" 
             alt="Mensajes" class="nav-icon">
      </a>

      <!-- Perfil -->
      <a href="#" class="nav-item" aria-label="Perfil">
        <img src="img/Perfil.png" 
             data-normal="img/Perfil.png" 
             data-active="img/Perfilactivo.png" 
             alt="Perfil" class="nav-icon">
      </a>

    </div>
  </nav>

  <script src="js/components/menu.js"></script>
</body>
</html>
