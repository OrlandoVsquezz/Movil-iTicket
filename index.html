<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="splash-active">

  <!-- Animación de Entrada -->
  <div class="splash-screen">
    <div class="splash-circle"></div>
    <div class="splash-logo">
      <img src="img/Logo.png" alt="Logo de la aplicación"> <!-- Con css se invierte el color y por eso se puede usar la misma img -->
    </div>
  </div>

  <main class="main">

    <div class="login-logo">
      <img src="img/Logo.png" alt="Logo iTicket">
    </div>

    <div class="subtitulo-texto">
      <p class="subtitulo">Bienvenido a iTicket</p>
      <p class="texto">¿Algún problema? Crea un ticket</p>
    </div>

    <form class="form">
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="20250267@ricaldone.edu.sv" autocomplete="email" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="password-container">
          <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
          <button type="button" class="password-icon" aria-label="Mostrar contraseña"></button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" name="remember">
        <span>Recuérdame la próxima vez</span>
      </label>

      <button type="submit" class="button button-iniciar">Iniciar sesión</button>

      <div class="forgot-password">
        <span>¿Olvidaste tu contraseña?</span>
        <a href="loginRecuperarContraseña.html">Recuperar</a>
      </div>

      <div class="login-divider">
        <span></span>
        <p>O inicia sesión con</p>
        <span></span>
      </div>

      <button type="button" class="google-button" aria-label="Iniciar sesión con Google">
        <img src="img/Google.png" alt="Google">
      </button>

    </form>

  </main>

  <div class="login-bottom-wave"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="js/controllers/login.js"></script>

</body>

</html>
