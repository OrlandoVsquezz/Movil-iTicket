<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/proyectos.css">
</head>

<body class="proyectos-page">

    <header class="encabezado-flotante proyectos-header">
        <div class="d-flex flex-row justify-content-around">
            <h1 class="titulo">Proyectos</h1>
            <div class="d-flex flex-row gap-2">
                <!--Boton para cambiar de interfaz-->
                <div class="filter-wrapper">
                    <button type="button" class="notificaciones">
                        <img src="img/Cambiar.png" alt="Cambiar contenido" class="imgNotificaciones">
                    </button>

                    <div class="filter-panel" id="panelCambiar">
                        <a href="misTickets.html" class="filter-opcion">
                            <span class="filter-check"></span> Mis Tickets
                        </a>
                        <a href="ticketsAsignados.html" class="filter-opcion">
                            <span class="filter-check"></span> Tickets Asignados
                        </a>
                        <a href="gestionTickets.html" class="filter-opcion">
                            <span class="filter-check"></span> Gestión de Tickets
                        </a>
                        <a href="proyectos.html" class="filter-opcion seleccionada">
                            <span class="filter-check"></span> Proyectos
                        </a>
                    </div>
                </div>

                <a href="notificaciones.html" class="notificaciones fs-4" style="color: black;">
                    <i class="bi bi-bell"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="main proyectos-main">

        <!-- Todo el menú -->
        <nav class="bottom-nav-container">
            <div class="bottom-nav">

                <!-- Inicio (Inicia activo) -->
                <a href="inicio.html" class="nav-item" aria-label="Inicio">
                    <img src="img/Inicioactivo.png" data-normal="img/inicio.png" data-active="img/Inicioactivo.png"
                        alt="Inicio" class="nav-icon">
                </a>

                <!-- Tickets -->
                <a href="misTickets.html" class="nav-item" aria-label="Tickets">
                    <img src="img/Ticket.png" data-normal="img/Ticket.png" data-active="img/Ticketactivo.png"
                        alt="Tickets" class="nav-icon">
                </a>

                <!-- Botón Central -->
                <a href="crearTickets.html" class="nav-item fab-item" aria-label="Agregar">
                    <div class="fab-button">
                        <img src="img/Crear Ticket.png" data-normal="img/Crear Ticket.png"
                            data-active="img/Crear Ticket activo.png" alt="Agregar" class="fab-icon">
                    </div>
                </a>

                <!-- Mensajes -->
                <a href="chatbot.html" class="nav-item" aria-label="Mensajes">
                    <img src="img/Chatbot.png" data-normal="img/Chatbot.png" data-active="img/Chatbotactivo.png"
                        alt="Mensajes" class="nav-icon">
                </a>

                <!-- Perfil -->
                <a href="#" class="nav-item" aria-label="Perfil">
                    <img src="img/Perfil.png" data-normal="img/Perfil.png" data-active="img/Perfilactivo.png"
                        alt="Perfil" class="nav-icon">
                </a>

            </div>
        </nav>

        <section class="search-container">

            <div class="search-box">
                <span class="search-icon">
                    <img src="img/Buscart.png" alt="">
                </span>

                <input type="text" class="search-input" placeholder="Buscar proyecto..." id="txtBuscar">
            </div>

            <div class="filters">

                <div class="filter-wrapper">
                    <button type="button" class="filter-button" data-filtro="tipo">
                        <span class="filter-text">Tipo</span>

                        <span class="filter-icon">
                            <img src="img/Dropdown.png" alt="Dropdown">
                        </span>
                    </button>

                    <div class="filter-panel" id="panelTipo">
                        <button type="button" class="filter-opcion" data-valor="">Ninguno</button>
                        <button type="button" class="filter-opcion" data-valor="Construccion">Construcción</button>
                        <button type="button" class="filter-opcion" data-valor="Remodelacion">Remodelación</button>
                        <button type="button" class="filter-opcion" data-valor="Ampliacion">Ampliación</button>
                        <button type="button" class="filter-opcion" data-valor="Mantenimiento">Mantenimiento</button>
                    </div>
                </div>

                <div class="filter-wrapper">
                    <button type="button" class="filter-button" data-filtro="estado">
                        <span class="filter-text">Estado</span>

                        <span class="filter-icon">
                            <img src="img/Dropdown.png" alt="Dropdown">
                        </span>
                    </button>

                    <div class="filter-panel" id="panelEstado">
                        <button type="button" class="filter-opcion" data-valor="">Ninguno</button>
                        <button type="button" class="filter-opcion" data-valor="false">En progreso</button>
                        <button type="button" class="filter-opcion" data-valor="true">Finalizado</button>
                    </div>
                </div>

                <div class="filter-wrapper">
                    <button type="button" class="filter-button" id="btnFecha">
                        <span class="filter-text">Fecha inicio</span>

                        <span class="filter-icon">
                            <img src="img/Calendario.png" alt="Calendario">
                        </span>
                    </button>
                    <input type="date" id="inputFecha" class="input-fecha-oculto">
                </div>

            </div>

        </section>

        <section class="proyectos-scroll" id="contenedorProyectos">
            <div class="ticket-card" id="proyectoCard">
                <div class="ticket-header d-flex flex-row gap-2">
                    <i class="bi bi-hammer"></i>
                    <span class="dot">•</span>
                    <p class="titulo fs-5">Demolición y limpieza</p>
                </div>

                <div class="proyecto-details">
                    <div class="col-md-6">
                        <p class="ticket-info"><strong>Proyecto:</strong></p>
                        <p class="ticket-info"><strong>Ubicación:</strong></p>
                        <p class="ticket-info"><strong>Coordinador:</strong></p>
                        <p class="ticket-info"><strong>Supervisor:</strong></p>
                    </div>
                    <div class="col-md-6">
                        <p class="ticket-info"><strong>Inicio estimado:</strong></p>
                        <p class="ticket-info"><strong>Final estimado:</strong></p>
                        <p class="ticket-info"><strong>Proveedor:</strong></p>
                        <p class="ticket-info"><strong>Presupuesto estimado:</strong></p>
                    </div>
                </div>

                <div class="proyecto-descripcion col-md-6">
                    <p class="ticket-info"><strong>Descripción:</strong></p>
                    <p class="ticket-info"></p>
                </div>
            </div>
        </section>

        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <span class="text-muted small" id="infoProyectos"></span>
            <nav aria-label="Paginacion">
                <ul class="pagination pagination-sm mb-0 align-items-center gap-1" id="paginacionProyectos"></ul>
            </nav>
        </div>
    </main>

    <!-- JS -->
    <script src="js/components/menu.js"></script>
    <script type="module" src="js/components/common.js"></script>
    <script type="module" src="js/controllers/proyectos.js"></script>
</body>

</html>
