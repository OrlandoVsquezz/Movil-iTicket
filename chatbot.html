<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/components/menu-cache.js"></script>

    <title>Chatbot</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body class="app-shell-active">

    <main class="main chatbot-main">

        <div class="contenedor-titulo">
            <h1 class="titulo">
                Chatbot
            </h1>
            <div class="acciones-encabezado-chat">
                <a href="historialChat.html" class="btn-historial-chat" aria-label="Historial de conversaciones">
                    <i class="bi bi-clock-history"></i>
                </a>
                <button type="button" class="notificaciones">
                    <img src="img/Notificaciones.png" alt="Notificaciones" class="imgNotificaciones">
                    <span class="notificacionAviso" hidden></span> <!-- Aqui el punto rojo esta escondido-->
                </button>
            </div>
        </div>

        <div class="contenedor-chat">

            <div class="chat-imagen-contenedor">
                <div class="chat-imagen">
                    <svg viewBox="0 0 52 46" fill="none" xmlns="http://www.w3.org/2000/svg"
                        class="chatbot-svg" role="img" aria-label="Ticky">
                        <path
                            d="M26 10.844V2H16.4M33.2 21.899V26.321M2 24.11H6.8M45.2 24.11H50M18.8 21.899V26.321M45.2 32.954C45.2 34.1268 44.6943 35.2516 43.7941 36.0809C42.8939 36.9101 41.673 37.376 40.4 37.376H18.3872C17.1143 37.3763 15.8936 37.8423 14.9936 38.6717L9.7088 43.5403C9.47049 43.7598 9.16689 43.9093 8.83637 43.9698C8.50586 44.0304 8.16328 43.9993 7.85194 43.8805C7.5406 43.7617 7.27449 43.5605 7.08725 43.3024C6.9 43.0443 6.80004 42.7408 6.8 42.4304V15.266C6.8 14.0932 7.30571 12.9685 8.20589 12.1392C9.10606 11.3099 10.327 10.844 11.6 10.844H40.4C41.673 10.844 42.8939 11.3099 43.7941 12.1392C44.6943 12.9685 45.2 14.0932V32.954Z"
                            stroke="currentColor" stroke-width="4" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <span class="chat-nombre">
                    Ticky · Asistente virtual
                </span>
            </div>

            <div class="contenedor-mensajes" id="contenedorMensajes" aria-live="polite">
                <!-- Se quita al enviar el primer mensaje o al abrir una conversación del historial -->
                <div class="chat-bienvenida" id="bienvenidaChat">
                    <strong>¡Hola! Soy Ticky</strong>
                    <p>Puedo ayudarte con tus tickets y con problemas técnicos sencillos.</p>
                    <div class="chat-sugerencias">
                        <button type="button"
                            data-chat-sugerencia="Dame un resumen de mis tickets, incluyendo cuántos están abiertos y cuántos vencidos.">
                            Ver el resumen de mis tickets
                        </button>
                        <button type="button"
                            data-chat-sugerencia="¿Cuál es mi ticket más reciente y en qué estado se encuentra?">
                            Ver mi ticket más reciente
                        </button>
                        <button type="button"
                            data-chat-sugerencia="Tengo un problema de conexión a internet. ¿Qué comprobaciones sencillas puedo realizar?">
                            Necesito ayuda con un problema de internet
                        </button>
                    </div>
                </div>
            </div>

            <form class="message-container" id="chatForm" autocomplete="off">
                <div class="message-box">
                    <textarea id="messageInput" class="message-input" placeholder="Envía un mensaje a Ticky"
                        aria-label="Escribe un mensaje" rows="1"></textarea>
                    <button type="submit" class="send-button" id="sendButton" aria-label="Enviar mensaje">
                        <svg class="composer-send-icon" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 20V4M5.5 10.5 12 4l6.5 6.5" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <nav class="bottom-nav-container">

            <div class="bottom-nav">

                <!-- Inicio -->

                <a href="index.html" class="nav-item" aria-label="Inicio">
                    <img src="img/Inicioactivo.png" data-normal="img/inicio.png" data-active="img/Inicioactivo.png"
                        alt="Inicio" class="nav-icon">
                </a>


                <!-- Tickets -->

                <a href="ticketsAsignados.html" class="nav-item" aria-label="Tickets">
                    <img src="img/Ticket.png" data-normal="img/Ticket.png" data-active="img/Ticketactivo.png"
                        alt="Tickets" class="nav-icon">
                </a>


                <!-- Botón central -->

                <a href="#" class="nav-item fab-item" aria-label="Agregar">
                    <div class="fab-button">
                        <img src="img/Crear Ticket.png" data-normal="img/Crear Ticket.png"
                            data-active="img/Crear Ticket activo.png" alt="Agregar" class="fab-icon">
                    </div>
                </a>


                <!-- Chat -->

                <a href="chatbot.html" class="nav-item active" aria-label="Mensajes">
                    <img src="img/Chatbot.png" data-normal="img/Chatbot.png" data-active="img/Chatbotactivo.png"
                        alt="Mensajes" class="nav-icon">
                </a>

                <!-- Perfil -->

                <a href="perfil.html" class="nav-item" aria-label="Perfil">
                    <img src="img/Perfil.png" data-normal="img/Perfil.png" data-active="img/Perfilactivo.png"
                        alt="Perfil" class="nav-icon">
                </a>
            </div>

        </nav>

    </main>

    <script src="js/components/menu.js"></script>
    <script type="module" src="js/components/common.js"></script>
    <script type="module" src="js/controllers/chatbot.js"></script>

    <script type="module" src="js/components/notificacionesBadge.js"></script>
</body>

</html>
